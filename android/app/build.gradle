apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Bundle react-native-vector-icons fonts (Ionicons etc.) into the APK.
apply from: file("../../node_modules/react-native-vector-icons/fonts.gradle")

// Release signing credentials, kept out of source control (android/key.properties).
def keystorePropertiesFile = rootProject.file("key.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.abhishek.anviksha"
    defaultConfig {
        applicationId "com.abhishek.anviksha"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 9
        versionName "1.0.8"

        // Universal CPU Architecture Support for maximum Play Store device reach
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
        }
    }
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Signed with the upload keystore from android/key.properties.
            signingConfig (keystorePropertiesFile.exists() ? signingConfigs.release : signingConfigs.debug)
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
}

// Write the native versionName/versionCode into a JS file so the app can show
// its real build version (Settings/About/menu) without a runtime dependency.
// Regenerated on every build; keeps src/generated/appVersion.ts in sync.
tasks.register("generateAppVersion") {
    def outFile = file("$rootDir/../src/generated/appVersion.ts")
    def vName = android.defaultConfig.versionName
    def vCode = android.defaultConfig.versionCode
    outputs.upToDateWhen { false }
    doLast {
        outFile.parentFile.mkdirs()
        outFile.text = "// AUTO-GENERATED at build time by the generateAppVersion Gradle task\n" +
            "// (android/app/build.gradle) from versionName / versionCode. Do not edit by hand.\n" +
            "export const APP_VERSION = '${vName}';\n" +
            "export const APP_BUILD = ${vCode};\n"
    }
}
tasks.configureEach { task ->
    if (task.name == "preBuild") task.dependsOn("generateAppVersion")
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
